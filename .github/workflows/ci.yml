name: CI

on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      of_ref:
        description: "openFrameworks git ref (branch/tag/SHA)"
        required: false
        default: "master"
      of_libs:
        description: "download_libs.sh release tag (latest|nightly|version)"
        required: false
        default: "latest"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OF_REF: ${{ github.event.inputs.of_ref || 'master' }}
  OF_LIBS_TAG: ${{ github.event.inputs.of_libs || 'latest' }}
  OF_JOBS: 2

jobs:
  # ---------------------------------------------------------------------------
  # Linux64 — make + headless ofxUnitTests
  # ---------------------------------------------------------------------------
  test-linux64:
    name: test · linux64 · OF ${{ github.event.inputs.of_ref || 'master' }}
    runs-on: ubuntu-24.04
    env:
      TARGET: linux64
    steps:
      - name: Checkout ofxMultiPlatform
        uses: actions/checkout@v4
        with:
          path: ofxMultiPlatform

      - name: Checkout openFrameworks
        uses: actions/checkout@v4
        with:
          repository: openframeworks/openFrameworks
          ref: ${{ env.OF_REF }}
          path: openFrameworks
          submodules: false

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.14
        with:
          key: linux64-${{ env.OF_REF }}-${{ env.OF_LIBS_TAG }}

      - name: Install OF Linux dependencies
        working-directory: openFrameworks
        run: |
          sudo ./scripts/linux/ubuntu/install_dependencies.sh -y
          # codecs optional — skip to keep CI lighter
          true

      - name: Download OF prebuilt libs
        working-directory: openFrameworks
        run: ./scripts/linux/download_libs.sh -t "${OF_LIBS_TAG}" -a 64gcc6

      - name: Place project under OF apps tree
        run: |
          mkdir -p openFrameworks/apps/myApps
          # Use a stable path name for OF_ROOT-relative defaults
          rm -rf openFrameworks/apps/myApps/ofxMultiPlatform
          cp -a ofxMultiPlatform openFrameworks/apps/myApps/ofxMultiPlatform

      - name: Build OF core (Debug)
        working-directory: openFrameworks/libs/openFrameworksCompiled/project
        run: |
          # lower debug info to save CI memory/time (same idea as OF CI)
          sed -i "s/PLATFORM_OPTIMIZATION_CFLAGS_DEBUG = .*/PLATFORM_OPTIMIZATION_CFLAGS_DEBUG = -g0/" \
            ../makefileCommon/config.linux.common.mk || true
          make -j"${OF_JOBS}" Debug

      - name: Build & run system tests
        env:
          OF_ROOT: ${{ github.workspace }}/openFrameworks
        run: |
          chmod +x openFrameworks/apps/myApps/ofxMultiPlatform/scripts/ci/run_tests.sh
          openFrameworks/apps/myApps/ofxMultiPlatform/scripts/ci/run_tests.sh Debug

  # ---------------------------------------------------------------------------
  # macOS — make (optional xcode path later)
  # ---------------------------------------------------------------------------
  test-macos:
    name: test · macOS · OF ${{ github.event.inputs.of_ref || 'master' }}
    runs-on: macos-15
    steps:
      - name: Checkout ofxMultiPlatform
        uses: actions/checkout@v4
        with:
          path: ofxMultiPlatform

      - name: Checkout openFrameworks
        uses: actions/checkout@v4
        with:
          repository: openframeworks/openFrameworks
          ref: ${{ env.OF_REF }}
          path: openFrameworks
          submodules: false

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.14
        with:
          key: macos-${{ env.OF_REF }}-${{ env.OF_LIBS_TAG }}

      - name: Download OF macOS libs
        working-directory: openFrameworks
        run: ./scripts/osx/download_libs.sh -t "${OF_LIBS_TAG}"

      - name: Place project under OF apps tree
        run: |
          mkdir -p openFrameworks/apps/myApps
          rm -rf openFrameworks/apps/myApps/ofxMultiPlatform
          cp -a ofxMultiPlatform openFrameworks/apps/myApps/ofxMultiPlatform

      - name: Build OF core (Debug)
        working-directory: openFrameworks/libs/openFrameworksCompiled/project
        run: make -j"${OF_JOBS}" Debug

      - name: Build & run system tests
        env:
          OF_ROOT: ${{ github.workspace }}/openFrameworks
        run: |
          chmod +x openFrameworks/apps/myApps/ofxMultiPlatform/scripts/ci/run_tests.sh
          openFrameworks/apps/myApps/ofxMultiPlatform/scripts/ci/run_tests.sh Debug
